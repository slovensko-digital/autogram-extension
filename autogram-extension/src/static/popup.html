<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <title>Autogram na štátnych weboch</title>
    <style>
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 200 900;
        font-display: swap;
        src: url("fonts/source-sans-3-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 200 900;
        font-display: swap;
        src: url("fonts/source-sans-3-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        font-family: "Source Sans 3", sans-serif;
        font-style: normal;
        font-weight: 400;
        font-size: 16px;
        line-height: 22px;
        /* identical to box height, or 137% */

        /* Farby pozadia/Light */

        background: #ffffff;
        margin: 10px;
      }

      h2 {
        margin: 0;
        font-weight: 600;
        font-size: 16px;
        text-align: center;
      }
      .button {
        margin-top: 20px;
        box-sizing: border-box;
        /* Website/Button */

        display: inline-block;
        padding: 8px 16px;
        gap: 10px;

        font-family: "Source Sans 3", sans-serif;
        font-style: normal;
        font-weight: 600;
        font-size: 18px;
        line-height: 24px;
        /* identical to box height, or 133% */

        text-align: center;
        text-decoration: none;

        /* Farby tlačidiel/Primárne tlačidlo */
        background: #126dff;
        border-radius: 8px;
        border: none;
        color: #ffffff;

        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h2>Autogram</h2>
    <h2>na štátnych weboch</h2>
    <button id="open-options" class="button">Nastavenia</button>
    <script src="/autogram-popup.bundle.js"></script>
  </body>
</html>
